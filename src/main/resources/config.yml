# FreeCoreAgent 配置文件
# 纯 UTF-8 编码，专职负责游戏内事件监听、Tab 虚拟角色与远程运维工具执行 (Remote Tool RPC)

locale: "zh_CN"

# 大模型 API 设置（兼容 OpenAI / DeepSeek / 任何兼容 API）
llm:
  api-key: "YOUR_API_KEY_HERE"
  base-url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  temperature: 0.8
  max-tokens: 500
  timeout-seconds: 15

# Agent 实体形象设置
agent:
  name: "CoreNyan"
  chat-prefix: "&8[&bFreeCore&8] &7[&6&l小可&7] &d"
  chat-format: "{prefix}{name}&f: {message}"
  tab-display: " &7[&6&l小可&7] &dCoreNyan"
  tab-skin-url: "https://account.lynnhma.xyz/textures/bba1bd32a0b8f50459c6e88d1dd8291e3841f4592b753d88182fc12cb0485623"
  tab-player:
    enabled: true
  tab-skin-value: ""
  tab-skin-signature: ""

# 游戏内聊天与事件上报
modules:
  public-chat:
    enabled: true
    batch-window-seconds: 3
  private-chat:
    enabled: true

# Redis 神经总线连接
redis:
  host: "127.0.0.1"
  port: 6379
  password: "271a4f5a54ad9854d5803a6a74db130d69970e04bed0bc6aab449af3903d14e3"

# 最高服主/管理员白名单
owners:
  - "LynnH_Ma"
  - "Rice"
